<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卫生打卡</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f1;color:#183e33;font-family:system-ui,"Microsoft YaHei",sans-serif}header{background:#123f35;color:white;padding:40px max(24px,calc((100vw - 1000px)/2)) 65px}header small{letter-spacing:3px;color:#afcdbb}h1{font-size:32px;margin:18px 0}header p{color:#c0d7ca}main{max-width:1048px;margin:-25px auto 50px;padding:0 24px}button,input{font:inherit}button{cursor:pointer;border:1px solid #cbdccb;border-radius:10px;padding:12px 20px;background:white;color:#24533e}button:focus-visible,input:focus-visible{outline:3px solid #cbac57}.tabs{background:white;border-radius:16px;padding:8px;display:flex;gap:8px;width:fit-content;box-shadow:0 4px 22px #123f3510}.tabs button{border:0}.tabs .active,.primary{background:#205d46;color:white}.panel{margin-top:25px;background:white;border:1px solid #dfe7dc;border-radius:18px;padding:26px}h2{font-size:20px;margin:0 0 10px}.muted,small{font-size:13px;color:#6f8274}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}label{font-size:14px;display:block}input:not([type=file]){display:block;width:100%;padding:13px;background:#f8faf6;border:1px solid #d4dfd0;border-radius:10px;margin-top:8px}.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px}.badge{padding:8px 12px;border-radius:20px;background:#e0ebdd;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #dce6d7;border-radius:16px;overflow:hidden}.photo{height:190px;background:#e6ede1;display:flex;align-items:center;justify-content:center;color:#6a806b;text-align:center;line-height:2}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:600}.upload{cursor:pointer;position:relative;border:1px solid #c7d8c1;border-radius:10px;text-align:center;padding:12px;margin-top:18px;color:#315c3e}.upload:focus-within{outline:3px solid #cbac57}.upload input{position:absolute;width:1px;height:1px;opacity:0}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.primary{border:0;min-width:180px}.primary:disabled{background:#bdcbbb;cursor:not-allowed}#notice{color:#ad4632;min-height:25px;margin-top:15px;font-size:14px}.record{margin-top:18px;padding:24px;background:white;border:1px solid #dce6d7;border-radius:16px}.record h3{margin:0 0 8px}.record-toggle{margin-top:16px}.record-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.record-grid img{width:100%;height:160px;object-fit:cover;border-radius:10px;cursor:zoom-in}.record-grid p{font-size:13px;color:#648069}.empty{text-align:center;padding:70px 10px;color:#708574}dialog{border:0;border-radius:16px;max-width:95vw;padding:12px}dialog::backdrop{background:#000b}dialog img{display:block;max-width:88vw;max-height:75vh}dialog button{margin-top:10px}[hidden]{display:none!important}@media(max-width:650px){h1{font-size:26px}.fields,.grid{grid-template-columns:1fr}.photo{height:210px}.footer{align-items:stretch;flex-direction:column}.record-grid img{height:95px}.panel{padding:20px}.record{padding:18px}}
</style></head><body><header><small>CLEAN SPACE · 每日卫生管理</small><h1>让整洁，成为每天的习惯。</h1><p>完成三个区域的清洁，拍照留存，安心收工。</p></header><main><nav class="tabs"><button id="tab0" class="active">卫生打卡</button><button id="tab1">打卡记录 · <span id="count">0</span></button></nav><section id="check"><form id="form"><div class="panel"><h2>今天，给环境一个新面貌</h2><small>填写打卡人信息，再逐一上传清洁照片。</small><div class="fields"><label>员工姓名<input id="name" maxlength="30" autocomplete="name" placeholder="请输入你的姓名" required></label><label>打卡日期<input id="date" type="date" required></label></div></div><div class="section"><div><h2>清洁区域</h2><small>每个区域必须上传一张清晰照片</small></div><span id="progress" class="badge">已完成 0 / 3</span></div><div class="grid" id="areas"></div><div class="footer"><small>记录保存在当前浏览器，重新打开仍可查看。<br>请勿清理网站数据，建议定期导出备份。</small><button id="submit" class="primary" disabled>完成全部区域后提交</button></div><p id="notice" role="status" aria-live="polite"></p></form></section><section id="history" hidden><div class="section"><div><h2>每一份整洁，都有记录</h2><small>按提交时间展示，最新记录在前</small></div></div><div id="records"></div></section></main><dialog id="viewer"><img id="large" alt="清洁照片预览"><button id="close">关闭预览</button></dialog><script>
'use strict';
const $=id=>document.getElementById(id), names=['工作区域','卫生间','走廊'], photos=[null,null,null], busy=[false,false,false], versions=[0,0,0];let db,saving=false;
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
$('date').value=today();$('date').max=today();
$('areas').innerHTML=names.map((n,i)=>`<article class="card"><div class="photo" id="photo${i}"><div>◎<br>清洁完成，拍照留存</div></div><div class="body"><div class="heading"><span>${n}</span><small id="status${i}">待上传</small></div><small>必填 · 展示清洁后的区域</small><label class="upload"><span id="label${i}">＋ 拍照 / 上传照片</span><input type="file" accept="image/*" data-index="${i}" aria-label="上传${n}照片"></label></div></article>`).join('');
function notify(s){$('notice').textContent=s}
function update(){const count=photos.filter(Boolean).length;$('progress').textContent=`已完成 ${count} / 3`;$('submit').disabled=!(db&&count===3&&$('name').value.trim()&&$('date').value&&!busy.some(Boolean)&&!saving);$('submit').textContent=saving?'保存中…':count===3?'提交今日打卡':'完成全部区域后提交'}
try{const req=indexedDB.open('hygiene-checkin',1);req.onupgradeneeded=()=>req.result.createObjectStore('records',{keyPath:'id',autoIncrement:true});req.onsuccess=()=>{db=req.result;update();load()};req.onerror=()=>notify('无法打开存储，请使用允许保存数据的普通浏览器窗口。')}catch(e){notify('浏览器不支持本地存储，请使用新版 Edge 或 Chrome。')}
function convert(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{const rate=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*rate));c.height=Math.max(1,Math.round(im.height*rate));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('图片无法读取'))};im.src=url})}
$('areas').addEventListener('change',async e=>{const input=e.target,file=input.files&&input.files[0];if(!file)return;const i=Number(input.dataset.index);if(!file.type.startsWith('image/')||file.size>30*1024*1024){notify('请选择不超过 30MB 的图片。');input.value='';return}const v=++versions[i];busy[i]=true;update();$('status'+i).textContent='处理中…';try{const data=await convert(file);if(v!==versions[i])return;photos[i]=data;const im=document.createElement('img');im.src=data;im.alt=names[i]+'照片';$('photo'+i).replaceChildren(im);$('label'+i).textContent='更换照片';notify('')}catch(err){notify('照片无法读取，请使用 JPG、PNG 等浏览器支持的图片。')}finally{if(v===versions[i]){busy[i]=false;$('status'+i).textContent=photos[i]?'✓ 已上传':'待上传';update()}input.value=''}});
$('name').oninput=update;$('date').oninput=update;
function tab(n){$('check').hidden=!!n;$('history').hidden=!n;$('tab0').classList.toggle('active',!n);$('tab1').classList.toggle('active',!!n)}$('tab0').onclick=()=>tab(0);$('tab1').onclick=()=>{tab(1);if(db)load()};
$('form').onsubmit=e=>{e.preventDefault();if(saving)return;const name=$('name').value.trim(),date=$('date').value;if(!name||!date||photos.some(p=>!p)||busy.some(Boolean)){notify('请填写姓名和日期，并上传全部三个区域的照片。');return}if(date>today()){notify('不能选择未来日期。');return}if(!db){notify('存储未就绪，无法提交。');return}saving=true;update();try{const tx=db.transaction('records','readwrite');tx.objectStore('records').add({name,date,time:new Date().toISOString(),photos:[...photos]});tx.oncomplete=()=>{saving=false;photos.fill(null);names.forEach((n,i)=>{$('photo'+i).innerHTML='<div>◎<br>清洁完成，拍照留存</div>';$('status'+i).textContent='待上传';$('label'+i).textContent='＋ 拍照 / 上传照片'});update();notify('打卡成功，记录与照片已保存。');load();tab(1)};tx.onerror=tx.onabort=()=>{saving=false;update();notify('保存失败，可能存储空间不足。照片仍在，可稍后重试。')}}catch(err){saving=false;update();notify('保存失败，请重新尝试。')}};
function load(){const r=db.transaction('records','readonly').objectStore('records').getAll();r.onsuccess=()=>{const records=r.result.reverse();$('count').textContent=records.length;$('records').replaceChildren();if(!records.length){$('records').innerHTML='<div class="empty">还没有打卡记录<br><br>完成第一次清洁打卡，让整洁有迹可循。</div>';return}records.forEach(record=>{const card=document.createElement('article');card.className='record';const head=document.createElement('div');head.className='heading';const info=document.createElement('div'),title=document.createElement('h3'),sub=document.createElement('small');title.textContent=record.name;sub.textContent=`${record.date} · 提交于 ${new Date(record.time).toLocaleString('zh-CN')}`;info.append(title,sub);const exportBtn=document.createElement('button');exportBtn.textContent='导出记录';exportBtn.onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`卫生打卡-${record.date}-${record.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};head.append(info,exportBtn);const toggle=document.createElement('button');toggle.className='record-toggle';toggle.textContent='查看图片';const grid=document.createElement('div');grid.className='record-grid';grid.hidden=true;toggle.onclick=()=>{grid.hidden=!grid.hidden;toggle.textContent=grid.hidden?'查看图片':'收起图片'};record.photos.forEach((src,i)=>{const box=document.createElement('div'),im=document.createElement('img'),caption=document.createElement('p');im.src=src;im.alt=names[i];im.tabIndex=0;const open=()=>{$('large').src=src;$('viewer').showModal()};im.onclick=open;im.onkeydown=e=>{if(e.key==='Enter')open()};caption.textContent='✓ '+names[i];box.append(im,caption);grid.append(box)});card.append(head,toggle,grid);$('records').append(card)})};r.onerror=()=>notify('读取记录失败，请重新打开页面。')}
$('close').onclick=()=>$('viewer').close();update();
</script></body></html>
